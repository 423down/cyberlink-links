<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CyberLink 离线包直链获取器</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #1a1a2e;
    color: #e0e0e0;
    min-height: 100vh;
    padding: 20px;
  }
  .container { max-width: 900px; margin: 0 auto; }
  h1 {
    text-align: center;
    font-size: 1.6em;
    margin-bottom: 8px;
    background: linear-gradient(135deg, #e94560, #0f3460);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .subtitle {
    text-align: center;
    color: #888;
    font-size: 0.85em;
    margin-bottom: 24px;
  }
  .cards {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }
  @media (max-width: 640px) {
    .cards { grid-template-columns: 1fr; }
  }
  .card {
    background: #16213e;
    border-radius: 12px;
    padding: 20px;
    border: 1px solid #0f3460;
    transition: border-color 0.3s;
  }
  .card:hover { border-color: #e94560; }
  .card-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
  }
  .card-title {
    font-size: 1.2em;
    font-weight: 600;
    color: #fff;
  }
  .badge {
    font-size: 0.7em;
    padding: 3px 8px;
    border-radius: 10px;
    background: #0f3460;
    color: #4ecca3;
  }
  .badge.loading { background: #533483; color: #ffd369; }
  .field { margin-bottom: 12px; }
  .field-label {
    font-size: 0.75em;
    color: #888;
    margin-bottom: 4px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .field-value {
    font-family: 'Consolas', 'Monaco', monospace;
    font-size: 0.8em;
    background: #0f0f23;
    padding: 8px 10px;
    border-radius: 6px;
    word-break: break-all;
    color: #e0e0e0;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 8px;
  }
  .field-value a {
    color: #4ecca3;
    text-decoration: none;
    flex: 1;
  }
  .field-value a:hover { text-decoration: underline; }
  .copy-btn {
    background: none;
    border: 1px solid #0f3460;
    color: #888;
    padding: 2px 8px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 0.85em;
    flex-shrink: 0;
    transition: all 0.2s;
  }
  .copy-btn:hover {
    border-color: #e94560;
    color: #e94560;
  }
  .copy-btn.copied {
    border-color: #4ecca3;
    color: #4ecca3;
  }
  .footer {
    text-align: center;
    margin-top: 24px;
    font-size: 0.75em;
    color: #555;
  }
  .footer a {
    color: #4ecca3;
    text-decoration: none;
  }
  .loading {
    display: inline-block;
    width: 12px;
    height: 12px;
    border: 2px solid #0f3460;
    border-top-color: #e94560;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    vertical-align: middle;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .toast {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: #0f3460;
    color: #4ecca3;
    padding: 10px 24px;
    border-radius: 8px;
    font-size: 0.9em;
    opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
<div class="container">
  <h1>CyberLink 离线包直链获取器</h1>
  <p class="subtitle">PowerDirector / PhotoDirector 最新离线安装包下载地址</p>

  <div class="cards">
    <!-- PowerDirector -->
    <div class="card" id="card-pd">
      <div class="card-header">
        <span class="card-title">PowerDirector</span>
        <span class="badge loading" id="badge-pd"><span class="loading"></span> 加载中</span>
      </div>
      <div class="field">
        <div class="field-label">离线包下载地址</div>
        <div class="field-value">
          <a href="#" target="_blank" id="link-pd">加载中...</a>
          <button class="copy-btn" onclick="copyText('link-pd')">复制</button>
        </div>
      </div>
      <div class="field">
        <div class="field-label">MD5</div>
        <div class="field-value">
          <span id="md5-pd">-</span>
          <button class="copy-btn" onclick="copyText('md5-pd')">复制</button>
        </div>
      </div>
      <div class="field">
        <div class="field-label">令牌</div>
        <div class="field-value">
          <span id="token-pd">-</span>
          <button class="copy-btn" onclick="copyText('token-pd')">复制</button>
        </div>
      </div>
      <div class="field">
        <div class="field-label">大小 / 版本 / 构建时间</div>
        <div class="field-value">
          <span id="meta-pd">-</span>
        </div>
      </div>
    </div>

    <!-- PhotoDirector -->
    <div class="card" id="card-phd">
      <div class="card-header">
        <span class="card-title">PhotoDirector</span>
        <span class="badge loading" id="badge-phd"><span class="loading"></span> 加载中</span>
      </div>
      <div class="field">
        <div class="field-label">离线包下载地址</div>
        <div class="field-value">
          <a href="#" target="_blank" id="link-phd">加载中...</a>
          <button class="copy-btn" onclick="copyText('link-phd')">复制</button>
        </div>
      </div>
      <div class="field">
        <div class="field-label">MD5</div>
        <div class="field-value">
          <span id="md5-phd">-</span>
          <button class="copy-btn" onclick="copyText('md5-phd')">复制</button>
        </div>
      </div>
      <div class="field">
        <div class="field-label">令牌</div>
        <div class="field-value">
          <span id="token-phd">-</span>
          <button class="copy-btn" onclick="copyText('token-phd')">复制</button>
        </div>
      </div>
      <div class="field">
        <div class="field-label">大小 / 版本 / 构建时间</div>
        <div class="field-value">
          <span id="meta-phd">-</span>
        </div>
      </div>
    </div>
  </div>

  <p class="footer" id="footer">
    数据加载中...<br>
    <a href="https://www.423down.com" target="_blank">423down.com</a>
  </p>
</div>

<div class="toast" id="toast">已复制到剪贴板</div>

<script>
// 版本号由后端定时任务自动识别并写入 data.json
// 页面只读 JSON，不依赖脚本运行

function copyText(id) {
  const el = document.getElementById(id);
  const text = el.tagName === 'A' ? el.href : el.textContent;
  if (!text || text === '-' || text === '加载中...') return;
  navigator.clipboard.writeText(text).then(() => {
    event.target.classList.add('copied');
    showToast('已复制到剪贴板');
    setTimeout(() => event.target.classList.remove('copied'), 1500);
  }).catch(() => {
    // 降级方案
    const ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    showToast('已复制到剪贴板');
  });
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

function formatSize(bytes) {
  if (!bytes || isNaN(bytes)) return '?';
  const n = parseInt(bytes);
  if (n < 1024) return n + ' B';
  if (n < 1048576) return (n/1024).toFixed(1) + ' KB';
  if (n < 1073741824) return (n/1048576).toFixed(1) + ' MB';
  return (n/1073741824).toFixed(2) + ' GB';
}

function formatDate(isoStr) {
  if (!isoStr) return '?';
  try {
    const d = new Date(isoStr);
    return d.toISOString().slice(0, 10);
  } catch(e) {
    return isoStr.slice(0, 10);
  }
}

function updateCard(key, data) {
  const link = data.link || '#';
  const md5 = data.md5 || '-';
  const token = data.token || '-';
  const version = data.version ? 'v' + data.version : '-';
  const size = data.size ? formatSize(data.size) + ' (' + parseInt(data.size).toLocaleString() + ' bytes)' : '-';
  const buildDate = data.build_date || formatDate(data.fetched_at) || '-';

  const linkEl = document.getElementById('link-' + key);
  linkEl.href = link;
  linkEl.textContent = link;
  document.getElementById('md5-' + key).textContent = md5;
  document.getElementById('token-' + key).textContent = token;
  document.getElementById('meta-' + key).textContent = size + ' / ' + version + ' / ' + buildDate;
  document.getElementById('badge-' + key).textContent = '自动更新';
  document.getElementById('badge-' + key).className = 'badge';
}

async function loadData() {
  try {
    // 加时间戳防止缓存
    const resp = await fetch('data.json?t=' + Date.now(), { cache: 'no-store' });
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    const data = await resp.json();

    if (data.products) {
      data.products.forEach(p => {
        if (p.product_key === 'powerdirector') updateCard('pd', p);
        else if (p.product_key === 'photodirector') updateCard('phd', p);
      });
    }

    const updated = data.updated_at ? formatDate(data.updated_at) : '?';
    document.getElementById('footer').innerHTML =
      '数据更新于 ' + updated + ' | 点击链接直接下载 | 令牌失效请联系更新<br>' +
      '<a href="https://www.423down.com" target="_blank">423down.com</a>';

  } catch(e) {
    console.error('加载数据失败:', e);
    document.getElementById('badge-pd').textContent = '加载失败';
    document.getElementById('badge-phd').textContent = '加载失败';
    document.getElementById('badge-pd').className = 'badge loading';
    document.getElementById('badge-phd').className = 'badge loading';
    document.getElementById('footer').innerHTML =
      '数据加载失败，请稍后刷新 | <a href="https://www.423down.com" target="_blank">423down.com</a>';
  }
}

// 页面加载时读取 data.json
window.addEventListener('load', loadData);
</script>
</body>
</html>
