name: 自动开启 GitHub Pages

on:
  push:
    paths:
      - '.github/workflows/enable-pages.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  enable-pages:
    runs-on: ubuntu-latest
    steps:
      - name: 开启 Pages
        id: pages
        run: |
          echo "尝试开启 GitHub Pages..."
          HTTP_CODE=$(curl -s -o /tmp/pages_response.json -w "%{http_code}" -L -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/pages \
            -d '{"source":{"branch":"main","path":"/"}}')
          echo "HTTP 状态码: $HTTP_CODE"
          cat /tmp/pages_response.json
          echo ""
          if [ "$HTTP_CODE" = "201" ] || [ "$HTTP_CODE" = "200" ]; then
            echo "✅ Pages 已开启"
          else
            echo "⚠️ 开启返回 $HTTP_CODE，查询当前状态..."
            curl -s -L \
              -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github+json" \
              https://api.github.com/repos/${{ github.repository }}/pages
            echo ""
          fi

      - name: 等待部署
        run: sleep 20

      - name: 验证 Pages
        run: |
          URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
          echo "Pages URL: $URL"
          echo "等待 30 秒后验证..."
          sleep 30
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -L "$URL")
          echo "页面 HTTP 状态码: $HTTP_CODE"
          if [ "$HTTP_CODE" = "200" ]; then
            echo "✅ Pages 部署成功，可以访问: $URL"
          else
            echo "⚠️ 页面返回 $HTTP_CODE，可能还在部署中，请稍后访问"
          fi
