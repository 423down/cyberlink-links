name: Rewrite Git History
on:
  workflow_dispatch:
jobs:
  rewrite:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rewrite author history
        run: |
          git filter-branch -f --env-filter '
          export GIT_AUTHOR_NAME="GitHub Action"
          export GIT_AUTHOR_EMAIL="action@github.com"
          export GIT_COMMITTER_NAME="GitHub Action"
          export GIT_COMMITTER_EMAIL="action@github.com"
          ' HEAD
      - name: Force push rewritten history
        run: |
          git push --force origin main
      - name: Cleanup workflow file
        run: |
          rm -f .github/workflows/rewrite-history.yml
          git add -A
          git -c user.name="GitHub Action" -c user.email="action@github.com" commit -m "Remove rewrite workflow" || true
          git push origin main || true
