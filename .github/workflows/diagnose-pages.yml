name: 诊断 Pages 状态

on:
  push:
    paths:
      - '.github/workflows/diagnose-pages.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 诊断并写入结果
        run: |
          RESULT="{"
          RESULT+="\"timestamp\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\","

          # 查询当前 Pages 状态
          HTTP_CODE=$(curl -s -o /tmp/get1.json -w "%{http_code}" -L \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/pages)
          RESULT+="\"get_before_http\":$HTTP_CODE,"
          RESULT+="\"get_before_body\":$(cat /tmp/get1.json | python3 -c 'import sys,json; print(json.dumps(sys.stdin.read()))' 2>/dev/null || echo '\"parse_error\"'),"

          # 尝试开启
          HTTP_CODE2=$(curl -s -o /tmp/post.json -w "%{http_code}" -L -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/pages \
            -d '{"source":{"branch":"main","path":"/"}}')
          RESULT+="\"post_http\":$HTTP_CODE2,"
          RESULT+="\"post_body\":$(cat /tmp/post.json | python3 -c 'import sys,json; print(json.dumps(sys.stdin.read()))' 2>/dev/null || echo '\"parse_error\"'),"

          # 再次查询
          HTTP_CODE3=$(curl -s -o /tmp/get2.json -w "%{http_code}" -L \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/pages)
          RESULT+="\"get_after_http\":$HTTP_CODE3,"
          RESULT+="\"get_after_body\":$(cat /tmp/get2.json | python3 -c 'import sys,json; print(json.dumps(sys.stdin.read()))' 2>/dev/null || echo '\"parse_error\"')"

          RESULT+="}"
          echo "$RESULT" > pages-status.json
          echo "诊断结果:"
          cat pages-status.json

      - name: 提交诊断结果
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pages-status.json
          git commit -m "Pages 诊断结果 $(date -u +%Y-%m-%dT%H:%M:%SZ)" || echo "无变更"
          git push
